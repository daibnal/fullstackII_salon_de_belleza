<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Inicio de Sesión</title>
		<!-- Estilos Bootstrap -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet" />

		<!-- Iconos de Bootstrap -->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

		<!-- Estilos propios -->
		<link
			rel="stylesheet"
			href="../css/principal.css" />

		<!-- Script Bootstrap 5 -->
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	</head>
	<body>
		<main class="main-container">
			<!-- PESTAÑAS DE NAVEGACIÓN -->
			<ul
				class="nav nav-pills"
				id="myTab"
				role="tablist">
				<!-- INICIAR SESIÓN -->
				<li
					class="nav-item"
					role="presentation">
					<button
						class="nav-link active"
						id="login-tab"
						data-bs-toggle="tab"
						data-bs-target="#home"
						type="button"
						role="tab"
						aria-controls="home"
						aria-selected="true">
						Iniciar sesión
					</button>
				</li>
				<!-- REGISTRAR -->
				<li
					class="nav-item"
					role="presentation">
					<button
						class="nav-link"
						id="signin-tab"
						data-bs-toggle="tab"
						data-bs-target="#profile"
						type="button"
						role="tab"
						aria-controls="profile"
						aria-selected="false">
						Crear cuenta
					</button>
				</li>
			</ul>
			<!-- CONTENIDO DE LAS PESTAÑAS -->
			<div
				class="tab-content card sketch-card"
				id="myTabContent">
				<div
					class="tab-pane fade show active"
					id="home"
					role="tabpanel"
					aria-labelledby="login-tab">
					<!-- FORMULARIO INCIO DE SESIÓN -->
					<form>
						<!-- Correo -->
						<div class="my-3">
							<label
								for="correo"
								class="form-label fw-bold small"
								>Correo electrónico</label
							>
							<input
								type="email"
								class="form-control"
								id="correoLogin"
								placeholder="correo@ejemplo.com" />
							<div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
						</div>

						<!-- Contraseña -->
						<div class="my-3">
							<label
								for="passwordLogin"
								class="form-label fw-bold small"
								>Contraseña</label
							>
							<input
								type="password"
								class="form-control bg-white"
								id="passwordLogin"
								placeholder="..." />
						</div>

						<!-- Mantener la sesión iniciada -->
						<div class="my-3 form-check">
							<input
								type="checkbox"
								class="form-check-input"
								id="mantenerSesion" />
							<label
								class="form-check-label"
								for="mantenerSesion"
								>Mantener la sesión iniciada</label
							>
						</div>
						<!-- Enviar formulario -->
						<div class="d-flex justify-content-center">
							<button
								type="submit"
								class="btn btn-custom-primary">
								Iniciar Sesión
							</button>
						</div>
					</form>
				</div>
				<!-- FORMULARIO DE REGISTRO -->
				<div
					class="tab-pane fade"
					id="profile"
					role="tabpanel"
					aria-labelledby="signin-tab">
					<form id="formRegistrar">
						<!-- Nombre y Apellido -->
						<div class="row">
							<div
								class="col-12 col-sm-6 my-3"
								id="field-wrap">
								<label
									for="nombre"
									class="form-label fw-bold small"
									>Nombre</label
								>
								<input
									type="text"
									class="form-control"
									id="nombre"
									placeholder="Tu nombre" />
								<div class="invalid-feedback">Ingresa un nombre válido (solo letras).</div>
							</div>
							<div class="col-12 col-sm-6 my-3">
								<label
									for="apellido"
									class="form-label fw-bold small"
									>Apellido</label
								>
								<input
									type="text"
									class="form-control"
									id="apellido"
									placeholder="Tu apellido" />
								<div class="invalid-feedback">Ingresa un apellido válido (solo letras).</div>
							</div>
						</div>

						<!-- RUT y Teléfono -->
						<div class="row">
							<div class="col-12 col-sm-6 my-3">
								<label
									for="rut"
									class="form-label fw-bold small"
									>RUT</label
								>
								<input
									type="text"
									class="form-control"
									id="rut"
									placeholder="12345678-9" />
								<div class="invalid-feedback">RUT inválido (Formato: 12345678-9).</div>
							</div>
							<div class="col-12 col-sm-6 my-3">
								<label
									for="telefono"
									class="form-label fw-bold small"
									>Teléfono</label
								>
								<input
									type="tel"
									class="form-control"
									id="telefono"
									placeholder="+56912345678" />
								<div class="invalid-feedback">
									Teléfono inválido (ej: +56991234567 o 9 dígitos).
								</div>
							</div>
						</div>

						<!-- Correo Electrónico -->
						<div class="my-3">
							<label
								for="correo"
								class="form-label fw-bold small"
								>Correo electrónico</label
							>
							<input
								type="email"
								class="form-control"
								id="correoRegistro"
								placeholder="correo@ejemplo.com" />
							<div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
						</div>

						<!-- Contraseña -->
						<div class="my-3">
							<label
								for="passwordRegistro"
								class="form-label fw-bold small"
								>Contraseña</label
							>
							<input
								type="password"
								class="form-control bg-white"
								id="passwordRegistro"
								placeholder="..." />
							<!-- Confirmación contraseña -->
							<label
								for="passwordComfirm"
								class="form-label fw-bold small"
								>Confirmación contraseña</label
							>
							<input
								type="password"
								class="form-control bg-white"
								id="passwordComfirm"
								placeholder="..." />
						</div>

						<!-- Enviar formulario -->
						<div class="d-flex justify-content-center">
							<button
								type="submit"
								class="btn btn-custom-primary">
								Crear cuenta
							</button>
						</div>
					</form>
				</div>
			</div>
		</main>
	</body>
</html>
