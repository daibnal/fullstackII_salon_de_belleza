<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cita Confirmada - Sakura Salón</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

        <!-- Estilos propios -->
        <link rel="stylesheet" href="../css/secondary.css" />
        <link rel="stylesheet" href="../css/main.css" />
    </head>
    <body class="container-fluid p-0 bg-light d-flex flex-column min-vh-100">

        <!-- Navbar sencillo -->
        <nav class="navbar color-primary px-4">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand text-white fw-bold" href="../index.html">Sakura Salón</a>
            </div>
        </nav>

        <!-- Contenido principal de Confirmación -->
        <main class="container my-auto py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card sketch-card p-4 p-md-5 text-center shadow-sm">
                        
                        <!-- Icono de éxito grande -->
                        <div class="mb-4">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                        </div>

                        <h1 class="h3 fw-bold mb-2" style="color: var(--color-primary);">¡Cita Confirmada!</h1>
                        <p class="text-muted mb-4">Tu pago se ha procesado exitosamente y tu reserva ha sido registrada.</p>

                        <!-- Detalles de la reserva -->
                        <div class="card bg-white border p-3 text-start mb-4 small">
                            <p class="mb-2"><strong>Cliente:</strong> <span id="confNombre">---</span></p>
                            <p class="mb-2"><strong>Servicio:</strong> <span id="confServicio">---</span></p>
                            <p class="mb-2"><strong>Profesional:</strong> <span id="confProfesional">---</span></p>
                            <p class="mb-2"><strong>Fecha y Hora:</strong> <span id="confFechaHora">---</span></p>
                            <p class="mb-2"><strong>Modalidad de Pago:</strong> <span id="confPago">---</span></p>
                            <p class="mb-0 text-success fw-bold"><strong>Comprobante enviado a:</strong> <span id="confCorreo">---</span></p>
                        </div>

                        <!-- Botones de acción -->
                        <div class="d-grid gap-2">
                            <a href="../index.html" class="btn btn-custom-primary py-2">Volver al Inicio</a>
                        </div>

                    </div>
                </div>
            </div>
        </main>

        <!-- Script para capturar y mostrar los datos de la cita -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Recuperamos los datos guardados temporalmente en sessionStorage
                const datosCita = JSON.parse(sessionStorage.getItem('detallesCita'));

                if (datosCita) {
                    document.getElementById('confNombre').textContent = `${datosCita.nombre} ${datosCita.apellido}`;
                    document.getElementById('confServicio').textContent = datosCita.servicio;
                    document.getElementById('confProfesional').textContent = datosCita.profesional;
                    document.getElementById('confFechaHora').textContent = `${datosCita.fecha} a las ${datosCita.hora}`;
                    document.getElementById('confPago').textContent = `${datosCita.tipoPago.toUpperCase()} ($ ${datosCita.montoPagado.toLocaleString('es-CL')})`;
                    document.getElementById('confCorreo').textContent = datosCita.correo;
                }
            });
        </script>
    </body>
</html>
